<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7299065442233643"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez Flat UI — Nanai Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #3B141A;
            --surface: #522129;
            --surface-2: #421921;
            --surface-3: #612731;
            --fill: rgba(229, 168, 83, 0.12);
            --fill-strong: rgba(229, 168, 83, 0.22);
            --separator: rgba(201, 134, 59, 0.25);
            --separator-strong: rgba(201, 134, 59, 0.4);
            --text: #FDF3E7;
            --text-2: rgba(253, 243, 231, 0.78);
            --text-3: rgba(253, 243, 231, 0.55);
            --accent: #E5A853;
            --accent-fill: #C9863B;
            --danger: #ff5252;
            --success: #4caf50;
            --btn-primary-bg: #E5A853;
            --btn-primary-hover: #f0be72;
            --btn-primary-fg: #3B141A;
            --shadow-lg: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(201, 134, 59, 0.15);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .flat-card {
            background-color: var(--surface);
            border: 2px solid var(--separator-strong);
            box-shadow: var(--shadow-lg);
        }

        .flat-panel {
            background-color: var(--bg);
            border: 2px solid var(--separator);
        }

        .board-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .board-container {
            width: min(480px, 90vw);
            height: min(480px, 90vw);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 3px;
            padding: 10px;
            border-radius: 16px;
            background-color: var(--surface-2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: transform 0.35s ease;
            user-select: none;
        }

        .board-container.flipped {
            transform: rotate(180deg);
        }

        .board-container.flipped .square {
            transform: rotate(-180deg);
        }

        .square {
            width: 100%;
            height: 100%;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: background-color 0.15s ease, transform 0.2s ease;
        }

        .square.light { background-color: var(--text); color: var(--bg); }
        .square.dark { background-color: var(--surface-3); color: var(--text); }
        .square:hover { filter: brightness(0.95); }

        .square.last-move {
            box-shadow: inset 0 0 0 2.5px rgba(229, 168, 83, 0.75);
            background-color: rgba(229, 168, 83, 0.35) !important;
        }

        .square.selected {
            background-color: var(--accent) !important;
        }

        .square.in-check {
            background-color: var(--danger) !important;
            animation: pulse-check 1.2s infinite alternate;
        }

        @keyframes pulse-check {
            from { filter: brightness(0.9); }
            to { filter: brightness(1.15); }
        }

        .square.highlight::after {
            content: '';
            position: absolute;
            width: 24%;
            height: 24%;
            background-color: var(--accent-fill);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(201, 134, 59, 0.7);
            pointer-events: none;
        }

        .square.highlight-capture::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 3px solid var(--accent);
            border-radius: 6px;
            pointer-events: none;
        }

        .piece-svg {
            width: 78%;
            height: 78%;
            transition: transform 0.12s ease;
            pointer-events: none;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
        }

        .square:hover .piece-svg { transform: scale(1.06); }

        .piece-holder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s ease;
        }

        .coord-label {
            position: absolute;
            font-size: 9px;
            font-weight: 700;
            opacity: 0.6;
            pointer-events: none;
        }
        .coord-rank { top: 2px; left: 3px; }
        .coord-file { bottom: 1px; right: 3px; }

        .btn-gold {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-fg);
            font-weight: 700;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-gold:hover { background-color: var(--btn-primary-hover); }
        .btn-gold:active { transform: scale(0.97); }

        .btn-flat {
            background-color: var(--surface-3);
            color: var(--text);
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }
        .btn-flat:hover:not(:disabled) { background-color: var(--fill-strong); }
        .btn-flat:disabled { opacity: 0.4; cursor: not-allowed; }

        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: var(--surface);
            color: var(--text);
            text-align: center;
            border-radius: 10px;
            padding: 10px 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            border: 2px solid var(--accent);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            opacity: 0;
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.25s, visibility 0.25s;
        }
        #toast.show { visibility: visible; opacity: 1; }

        .moves-list {
            max-height: 180px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-fill) transparent;
        }
        .moves-list::-webkit-scrollbar { width: 6px; }
        .moves-list::-webkit-scrollbar-thumb { background: var(--accent-fill); border-radius: 3px; }

        .ai-thinking {
            animation: pulse-thinking 1.4s infinite;
        }
        @keyframes pulse-thinking {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Drag ghost */
        .dragging { opacity: 0.45; }
        .drag-over { outline: 2px dashed var(--accent); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-3 sm:p-4">

    <main class="w-full max-w-[520px] flex flex-col items-center gap-3 my-auto pb-6">

        <!-- Header / Status -->
        <div class="w-full flat-card rounded-xl p-3 flex flex-col gap-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <div id="turn-indicator" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg btn-gold text-xs">
                        <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-white border border-black/40 inline-block"></span>
                        <span id="turn-text">Blancas</span>
                    </div>
                    <div id="game-status" class="text-xs font-semibold px-1.5 py-0.5 rounded bg-black/20" style="color: var(--accent);">
                        En curso
                    </div>
                    <div id="ai-status" class="text-[11px] px-1.5 py-0.5 rounded hidden ai-thinking" style="background: var(--fill-strong); color: var(--accent);">
                        IA pensando…
                    </div>
                </div>

                <div class="flex items-center gap-1.5">
                    <button id="btn-sound" onclick="toggleSound()" title="Sonido" class="p-1.5 rounded-lg btn-flat text-xs">🔊</button>
                    <button onclick="flipBoard()" title="Voltear tablero" class="p-1.5 rounded-lg btn-flat text-xs">⇅</button>
                    <button id="btn-undo" onclick="undoMove()" title="Deshacer" class="px-2.5 py-1.5 rounded-lg text-xs btn-flat font-medium" disabled>↩</button>
                    <button onclick="resetGame()" title="Reiniciar" class="px-2.5 py-1.5 rounded-lg text-xs btn-flat font-medium">🔄</button>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t" style="border-color: var(--separator);">
                <div class="flex items-center gap-2">
                    <label class="text-[11px] uppercase tracking-wider" style="color: var(--text-3);">Modo:</label>
                    <select id="game-mode" onchange="changeGameMode(this.value)" class="flat-panel text-xs px-2 py-1 rounded-lg font-medium outline-none cursor-pointer" style="color: var(--text);">
                        <option value="1vai" style="background: var(--bg);">1 vs IA</option>
                        <option value="1v1" style="background: var(--bg);">1 vs 1</option>
                        <option value="aivia" style="background: var(--bg);">IA vs IA</option>
                    </select>
                </div>

                <div id="human-color-wrapper" class="flex items-center gap-2">
                    <label class="text-[11px] uppercase tracking-wider" style="color: var(--text-3);">Juegas:</label>
                    <select id="human-color" onchange="changeHumanColor(this.value)" class="flat-panel text-xs px-2 py-1 rounded-lg font-medium outline-none cursor-pointer" style="color: var(--text);">
                        <option value="w" style="background: var(--bg);">Blancas</option>
                        <option value="b" style="background: var(--bg);">Negras</option>
                    </select>
                </div>

                <div id="ai-depth-wrapper" class="flex items-center gap-2">
                    <label class="text-[11px] uppercase tracking-wider" style="color: var(--text-3);">Nivel:</label>
                    <select id="ai-depth" onchange="changeAIDepth(this.value)" class="flat-panel text-xs px-2 py-1 rounded-lg font-medium outline-none cursor-pointer" style="color: var(--text);">
                        <option value="1" style="background: var(--bg);">Básico</option>
                        <option value="2" selected style="background: var(--bg);">Intermedio</option>
                        <option value="3" style="background: var(--bg);">Avanzado</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Board -->
        <div class="flex flex-col items-center w-full">
            <div class="board-wrapper">
                <div class="board-container" id="chessboard"></div>
            </div>
        </div>

        <!-- Captured + Advantage -->
        <div class="w-full flat-card rounded-xl p-3 flex flex-col gap-2 text-xs">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-1.5 overflow-hidden">
                    <span class="shrink-0 font-medium" style="color: var(--text-2);">Blancas capturan:</span>
                    <div id="captured-by-white" class="flex flex-wrap gap-0.5 min-h-[20px] items-center"></div>
                </div>
                <span id="advantage-white" class="font-bold text-[11px] px-1.5 py-0.5 rounded hidden" style="background: var(--fill-strong); color: var(--accent);"></span>
            </div>
            <div class="flex items-center justify-between border-t pt-1.5" style="border-color: var(--separator);">
                <div class="flex items-center gap-1.5 overflow-hidden">
                    <span class="shrink-0 font-medium" style="color: var(--text-2);">Negras capturan:</span>
                    <div id="captured-by-black" class="flex flex-wrap gap-0.5 min-h-[20px] items-center"></div>
                </div>
                <span id="advantage-black" class="font-bold text-[11px] px-1.5 py-0.5 rounded hidden" style="background: var(--fill-strong); color: var(--accent);"></span>
            </div>
        </div>

        <!-- Move History + Tools -->
        <div class="w-full flat-card rounded-xl p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider" style="color: var(--accent);">Historial de jugadas</span>
                <div class="flex gap-1.5">
                    <button onclick="copyFEN()" class="px-2 py-1 rounded-lg text-[11px] btn-flat font-medium" title="Copiar FEN">FEN</button>
                    <button onclick="copyPGN()" class="px-2 py-1 rounded-lg text-[11px] btn-flat font-medium" title="Copiar PGN">PGN</button>
                    <button onclick="loadFENPrompt()" class="px-2 py-1 rounded-lg text-[11px] btn-flat font-medium" title="Cargar FEN">Cargar</button>
                </div>
            </div>
            <div id="moves-list" class="moves-list text-xs font-mono leading-relaxed px-1" style="color: var(--text-2);"></div>
            <div class="text-[10px] text-center pt-1" style="color: var(--text-3);">
                Halfmove: <span id="halfmove-clock">0</span> · Repeticiones: <span id="rep-count">1</span>
            </div>
        </div>
    </main>

    <!-- Promotion Modal -->
    <div id="promotion-modal" class="fixed inset-0 bg-black/70 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="flat-card rounded-2xl p-5 max-w-xs w-full text-center flex flex-col gap-4">
            <h3 class="text-sm font-bold uppercase tracking-wider" style="color: var(--accent);">Promocionar Peón</h3>
            <p class="text-xs" style="color: var(--text-2);">Elige la pieza:</p>
            <div id="promotion-options" class="grid grid-cols-4 gap-2"></div>
        </div>
    </div>

    <div id="toast">Notificación</div>

    <script>
        /* ============================================================
           1. PIECES SVG
           ============================================================ */
        function getPieceSVG(char, sizeClass = 'piece-svg') {
            if (!char) return '';
            const isWhite = char === char.toUpperCase();
            const type = char.toLowerCase();
            const fill = isWhite ? '#FDF3E7' : '#240B10';
            const stroke = isWhite ? '#3B141A' : '#E5A853';
            const detail = isWhite ? '#C9863B' : '#E5A853';

            const paths = {
                p: `<path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>`,
                r: `<g><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke="${detail}"/></g>`,
                n: `<g><path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"/><path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10"/><circle cx="14.5" cy="15.5" r="1.2" fill="${stroke}"/></g>`,
                b: `<g><g><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.354.49-2.323.47-3-.5 1.354-1.94 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.5"/></g><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5" fill="none" stroke="${detail}"/></g>`,
                q: `<g><circle cx="6" cy="12" r="2.2"/><circle cx="14" cy="9" r="2.2"/><circle cx="22.5" cy="8" r="2.2"/><circle cx="31" cy="9" r="2.2"/><circle cx="39" cy="12" r="2.2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none" stroke="${detail}"/></g>`,
                k: `<g><path d="M22.5 11.63V6M20 8h5" fill="none" stroke="${stroke}" stroke-width="2.5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0" fill="none" stroke="${detail}"/></g>`
            };
            return `<svg viewBox="0 0 45 45" class="${sizeClass}" fill="${fill}" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${paths[type]}</svg>`;
        }

        /* ============================================================
           2. AUDIO
           ============================================================ */
        let soundEnabled = true;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'capture') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.14);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    osc.start(now); osc.stop(now + 0.14);
                } else if (type === 'check') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                    osc.start(now); osc.stop(now + 0.24);
                } else if (type === 'gameover') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.12);
                    osc.frequency.setValueAtTime(659.25, now + 0.24);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
                    osc.start(now); osc.stop(now + 0.55);
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btn-sound').textContent = soundEnabled ? '🔊' : '🔇';
            showToast(soundEnabled ? 'Sonido activado' : 'Sonido silenciado');
        }

        /* ============================================================
           3. STATE & CONSTANTS
           ============================================================ */
        const INITIAL_BOARD = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let state = {
            board: [],
            turn: 'w',
            castling: { wK: true, wQ: true, bK: true, bQ: true },
            enPassant: null,
            lastMove: null,
            captured: { w: [], b: [] },
            gameOver: false,
            inCheck: false,
            halfmoveClock: 0,
            fullmoveNumber: 1,
            positionHistory: [] // for threefold
        };

        let historyStack = [];
        let selectedSquare = null;
        let legalMovesForSelected = [];
        let pendingPromotion = null;
        let gameMode = '1vai';
        let aiDepth = 2;
        let humanColor = 'w';
        let aiTimer = null;
        let isFlipped = false;
        let moveHistory = []; // {san, from, to, ...}
        let isAIThinking = false;
        let dragSource = null;

        const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        const PST = {
            p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
            n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
            b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],[-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
            r: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
            q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
            k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]]
        };

        /* ============================================================
           4. RULES ENGINE
           ============================================================ */
        function cloneState(s) {
            return {
                board: s.board.map(row => [...row]),
                turn: s.turn,
                castling: { ...s.castling },
                enPassant: s.enPassant ? { ...s.enPassant } : null,
                lastMove: s.lastMove ? { ...s.lastMove } : null,
                captured: { w: [...s.captured.w], b: [...s.captured.b] },
                gameOver: s.gameOver,
                inCheck: s.inCheck,
                halfmoveClock: s.halfmoveClock,
                fullmoveNumber: s.fullmoveNumber,
                positionHistory: [...s.positionHistory]
            };
        }

        function isWhitePiece(piece) { return piece !== '' && piece === piece.toUpperCase(); }
        function belongsTo(piece, color) {
            if (!piece) return false;
            return color === 'w' ? isWhitePiece(piece) : !isWhitePiece(piece);
        }

        function findKing(board, color) {
            const target = color === 'w' ? 'K' : 'k';
            for (let r = 0; r < 8; r++)
                for (let c = 0; c < 8; c++)
                    if (board[r][c] === target) return { r, c };
            return null;
        }

        function isSquareAttacked(board, r, c, byColor) {
            const enemyPawn = byColor === 'w' ? 'P' : 'p';
            const pawnDir = byColor === 'w' ? 1 : -1;
            for (const dc of [-1, 1]) {
                const pr = r + pawnDir, pc = c + dc;
                if (pr >= 0 && pr < 8 && pc >= 0 && pc < 8 && board[pr][pc] === enemyPawn) return true;
            }
            const enemyKnight = byColor === 'w' ? 'N' : 'n';
            const knightOffsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
            for (const [dr, dc] of knightOffsets) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && board[nr][nc] === enemyKnight) return true;
            }
            const enemyKing = byColor === 'w' ? 'K' : 'k';
            for (let dr = -1; dr <= 1; dr++)
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const kr = r + dr, kc = c + dc;
                    if (kr >= 0 && kr < 8 && kc >= 0 && kc < 8 && board[kr][kc] === enemyKing) return true;
                }
            const orthoDirs = [[-1,0],[1,0],[0,-1],[0,1]];
            const enemyRook = byColor === 'w' ? 'R' : 'r';
            const enemyQueen = byColor === 'w' ? 'Q' : 'q';
            for (const [dr, dc] of orthoDirs) {
                let step = 1;
                while (true) {
                    const tr = r + dr * step, tc = c + dc * step;
                    if (tr < 0 || tr >= 8 || tc < 0 || tc >= 8) break;
                    const p = board[tr][tc];
                    if (p !== '') {
                        if (p === enemyRook || p === enemyQueen) return true;
                        break;
                    }
                    step++;
                }
            }
            const diagDirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
            const enemyBishop = byColor === 'w' ? 'B' : 'b';
            for (const [dr, dc] of diagDirs) {
                let step = 1;
                while (true) {
                    const tr = r + dr * step, tc = c + dc * step;
                    if (tr < 0 || tr >= 8 || tc < 0 || tc >= 8) break;
                    const p = board[tr][tc];
                    if (p !== '') {
                        if (p === enemyBishop || p === enemyQueen) return true;
                        break;
                    }
                    step++;
                }
            }
            return false;
        }

        function isInCheck(board, color) {
            const kingPos = findKing(board, color);
            if (!kingPos) return false;
            return isSquareAttacked(board, kingPos.r, kingPos.c, color === 'w' ? 'b' : 'w');
        }

        function getPseudoMoves(simState, r, c) {
            const board = simState.board;
            const piece = board[r][c];
            if (!piece) return [];
            const color = isWhitePiece(piece) ? 'w' : 'b';
            const enemy = color === 'w' ? 'b' : 'w';
            const type = piece.toLowerCase();
            const moves = [];

            const pushIfValid = (tr, tc, extra = {}) => {
                if (tr < 0 || tr >= 8 || tc < 0 || tc >= 8) return false;
                const target = board[tr][tc];
                if (target === '') {
                    moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, ...extra });
                    return true;
                } else if (belongsTo(target, enemy)) {
                    moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, capture: true, ...extra });
                    return false;
                }
                return false;
            };

            if (type === 'p') {
                const dir = color === 'w' ? -1 : 1;
                const startRow = color === 'w' ? 6 : 1;
                const promoRow = color === 'w' ? 0 : 7;
                const oneR = r + dir;
                if (oneR >= 0 && oneR < 8 && board[oneR][c] === '') {
                    if (oneR === promoRow) {
                        ['q','r','b','n'].forEach(promo => moves.push({ fromR: r, fromC: c, toR: oneR, toC: c, promotion: promo }));
                    } else {
                        moves.push({ fromR: r, fromC: c, toR: oneR, toC: c });
                        const twoR = r + 2 * dir;
                        if (r === startRow && board[twoR][c] === '') {
                            moves.push({ fromR: r, fromC: c, toR: twoR, toC: c, doublePawn: true });
                        }
                    }
                }
                for (const dc of [-1, 1]) {
                    const tr = r + dir, tc = c + dc;
                    if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
                        const target = board[tr][tc];
                        if (target !== '' && belongsTo(target, enemy)) {
                            if (tr === promoRow) {
                                ['q','r','b','n'].forEach(promo => moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, capture: true, promotion: promo }));
                            } else {
                                moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, capture: true });
                            }
                        } else if (simState.enPassant && simState.enPassant.r === tr && simState.enPassant.c === tc) {
                            moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, capture: true, isEnPassant: true });
                        }
                    }
                }
            } else if (type === 'n') {
                [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc]) => pushIfValid(r+dr, c+dc));
            } else if (type === 'b' || type === 'r' || type === 'q') {
                const dirs = [];
                if (type === 'b' || type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
                if (type === 'r' || type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
                dirs.forEach(([dr,dc]) => {
                    let step = 1;
                    while (pushIfValid(r + dr*step, c + dc*step)) step++;
                });
            } else if (type === 'k') {
                for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++)
                        if (dr || dc) pushIfValid(r+dr, c+dc);
                const homeRow = color === 'w' ? 7 : 0;
                if (r === homeRow && c === 4 && !isInCheck(board, color)) {
                    const canShort = color === 'w' ? simState.castling.wK : simState.castling.bK;
                    if (canShort && board[homeRow][5] === '' && board[homeRow][6] === '') {
                        if (!isSquareAttacked(board, homeRow, 5, enemy) && !isSquareAttacked(board, homeRow, 6, enemy)) {
                            moves.push({ fromR: homeRow, fromC: 4, toR: homeRow, toC: 6, castle: 'K' });
                        }
                    }
                    const canLong = color === 'w' ? simState.castling.wQ : simState.castling.bQ;
                    if (canLong && board[homeRow][3] === '' && board[homeRow][2] === '' && board[homeRow][1] === '') {
                        if (!isSquareAttacked(board, homeRow, 3, enemy) && !isSquareAttacked(board, homeRow, 2, enemy)) {
                            moves.push({ fromR: homeRow, fromC: 4, toR: homeRow, toC: 2, castle: 'Q' });
                        }
                    }
                }
            }
            return moves;
        }

        function applyMoveToState(prevState, move) {
            const next = cloneState(prevState);
            const b = next.board;
            const piece = b[move.fromR][move.fromC];
            const color = isWhitePiece(piece) ? 'w' : 'b';
            const type = piece.toLowerCase();
            const isCapture = !!move.capture || !!move.isEnPassant;
            const isPawnMove = type === 'p';

            if (b[move.toR][move.toC] !== '') next.captured[color].push(b[move.toR][move.toC]);
            if (move.isEnPassant) {
                const capRow = move.fromR;
                next.captured[color].push(b[capRow][move.toC]);
                b[capRow][move.toC] = '';
            }

            if (move.promotion) {
                b[move.toR][move.toC] = color === 'w' ? move.promotion.toUpperCase() : move.promotion.toLowerCase();
            } else {
                b[move.toR][move.toC] = piece;
            }
            b[move.fromR][move.fromC] = '';

            if (move.castle === 'K') {
                b[move.fromR][5] = b[move.fromR][7];
                b[move.fromR][7] = '';
            } else if (move.castle === 'Q') {
                b[move.fromR][3] = b[move.fromR][0];
                b[move.fromR][0] = '';
            }

            if (type === 'k') {
                if (color === 'w') { next.castling.wK = false; next.castling.wQ = false; }
                else { next.castling.bK = false; next.castling.bQ = false; }
            }
            if ((move.fromR === 7 && move.fromC === 0) || (move.toR === 7 && move.toC === 0)) next.castling.wQ = false;
            if ((move.fromR === 7 && move.fromC === 7) || (move.toR === 7 && move.toC === 7)) next.castling.wK = false;
            if ((move.fromR === 0 && move.fromC === 0) || (move.toR === 0 && move.toC === 0)) next.castling.bQ = false;
            if ((move.fromR === 0 && move.fromC === 7) || (move.toR === 0 && move.toC === 7)) next.castling.bK = false;

            if (move.doublePawn) next.enPassant = { r: (move.fromR + move.toR) / 2, c: move.fromC };
            else next.enPassant = null;

            next.lastMove = { fromR: move.fromR, fromC: move.fromC, toR: move.toR, toC: move.toC };
            next.turn = color === 'w' ? 'b' : 'w';
            next.inCheck = isInCheck(b, next.turn);

            // Clocks
            if (isCapture || isPawnMove) next.halfmoveClock = 0;
            else next.halfmoveClock++;
            if (color === 'b') next.fullmoveNumber++;

            return next;
        }

        function getAllLegalMoves(simState, color) {
            const legal = [];
            for (let r = 0; r < 8; r++)
                for (let c = 0; c < 8; c++)
                    if (belongsTo(simState.board[r][c], color)) {
                        const pseudo = getPseudoMoves(simState, r, c);
                        for (const m of pseudo) {
                            const nextSim = applyMoveToState(simState, m);
                            if (!isInCheck(nextSim.board, color)) legal.push(m);
                        }
                    }
            return legal;
        }

        function hasInsufficientMaterial(board) {
            const pieces = [];
            let whiteBishops = [], blackBishops = [];
            for (let r = 0; r < 8; r++)
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (!p) continue;
                    const t = p.toLowerCase();
                    if (t === 'k') continue;
                    if (t === 'p' || t === 'r' || t === 'q') return false;
                    pieces.push({ t, color: isWhitePiece(p) ? 'w' : 'b', squareColor: (r + c) % 2 });
                    if (t === 'b') {
                        if (isWhitePiece(p)) whiteBishops.push((r + c) % 2);
                        else blackBishops.push((r + c) % 2);
                    }
                }
            if (pieces.length === 0) return true;
            if (pieces.length === 1 && (pieces[0].t === 'b' || pieces[0].t === 'n')) return true;
            if (pieces.length === 2) {
                const bothKnights = pieces.every(p => p.t === 'n');
                if (bothKnights) return true;
                // Same color bishops
                if (pieces[0].t === 'b' && pieces[1].t === 'b' && pieces[0].squareColor === pieces[1].squareColor) return true;
            }
            return false;
        }

        function getPositionKey(simState) {
            // Simplified FEN-like key for threefold (board + turn + castling + ep)
            let key = '';
            for (let r = 0; r < 8; r++)
                for (let c = 0; c < 8; c++)
                    key += simState.board[r][c] || '.';
            key += simState.turn;
            key += (simState.castling.wK ? 'K' : '') + (simState.castling.wQ ? 'Q' : '') + (simState.castling.bK ? 'k' : '') + (simState.castling.bQ ? 'q' : '');
            if (simState.enPassant) key += simState.enPassant.r + '' + simState.enPassant.c;
            return key;
        }

        function countRepetitions(simState) {
            const key = getPositionKey(simState);
            return simState.positionHistory.filter(k => k === key).length;
        }

        /* ============================================================
           5. AI (Minimax + AlphaBeta + simple quiescence-ish)
           ============================================================ */
        function evaluateBoard(simState) {
            let score = 0;
            const b = simState.board;
            for (let r = 0; r < 8; r++)
                for (let c = 0; c < 8; c++) {
                    const p = b[r][c];
                    if (!p) continue;
                    const isW = isWhitePiece(p);
                    const type = p.toLowerCase();
                    const pstRow = isW ? r : 7 - r;
                    const value = PIECE_VALUES[type] + (PST[type] ? PST[type][pstRow][c] : 0);
                    score += isW ? value : -value;
                }
            // Small mobility bonus
            const wMoves = getAllLegalMoves(simState, 'w').length;
            const bMoves = getAllLegalMoves(simState, 'b').length;
            score += (wMoves - bMoves) * 3;
            return score;
        }

        function minimax(simState, depth, alpha, beta, isMaximizing) {
            const color = isMaximizing ? 'w' : 'b';
            const legalMoves = getAllLegalMoves(simState, color);

            if (legalMoves.length === 0) {
                if (isInCheck(simState.board, color))
                    return isMaximizing ? (-100000 - depth * 100) : (100000 + depth * 100);
                return 0;
            }
            if (depth === 0) return evaluateBoard(simState);

            // Move ordering: captures & promotions first, then center-ish
            legalMoves.sort((a, b) => {
                const scoreA = (a.capture ? 100 : 0) + (a.promotion ? 80 : 0) + (a.castle ? 20 : 0);
                const scoreB = (b.capture ? 100 : 0) + (b.promotion ? 80 : 0) + (b.castle ? 20 : 0);
                return scoreB - scoreA;
            });

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (const m of legalMoves) {
                    const nextState = applyMoveToState(simState, m);
                    const ev = minimax(nextState, depth - 1, alpha, beta, false);
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (const m of legalMoves) {
                    const nextState = applyMoveToState(simState, m);
                    const ev = minimax(nextState, depth - 1, alpha, beta, true);
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function setAIThinking(on) {
            isAIThinking = on;
            const el = document.getElementById('ai-status');
            if (on) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function triggerAIMove() {
            if (aiTimer) clearTimeout(aiTimer);
            if (state.gameOver || pendingPromotion) return;

            const isAITurn = gameMode === 'aivia' ||
                (gameMode === '1vai' && state.turn !== humanColor);

            if (!isAITurn) return;

            setAIThinking(true);
            aiTimer = setTimeout(() => {
                if (state.gameOver) { setAIThinking(false); return; }
                const legalMoves = getAllLegalMoves(state, state.turn);
                if (legalMoves.length === 0) { setAIThinking(false); return; }

                const filteredMoves = legalMoves.filter(m => !m.promotion || m.promotion === 'q');
                const isMaximizing = state.turn === 'w';
                let bestScore = isMaximizing ? -Infinity : Infinity;
                let bestMoves = [];

                for (const move of filteredMoves) {
                    const nextState = applyMoveToState(state, move);
                    const score = minimax(nextState, aiDepth - 1, -Infinity, Infinity, !isMaximizing);
                    if (isMaximizing) {
                        if (score > bestScore) { bestScore = score; bestMoves = [move]; }
                        else if (score === bestScore) bestMoves.push(move);
                    } else {
                        if (score < bestScore) { bestScore = score; bestMoves = [move]; }
                        else if (score === bestScore) bestMoves.push(move);
                    }
                }

                const chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];
                setAIThinking(false);
                commitMove(chosen);
            }, 280);
        }

        /* ============================================================
           6. NOTATION & FEN / PGN
           ============================================================ */
        function squareToAlg(r, c) {
            return String.fromCharCode(97 + c) + (8 - r);
        }

        function moveToSAN(move, simStateBefore) {
            const piece = simStateBefore.board[move.fromR][move.fromC];
            const type = piece.toLowerCase();
            const isWhite = isWhitePiece(piece);
            let san = '';

            if (move.castle === 'K') return 'O-O';
            if (move.castle === 'Q') return 'O-O-O';

            if (type !== 'p') san += type.toUpperCase();

            // Disambiguation (simple)
            if (type === 'n' || type === 'r' || type === 'b' || type === 'q') {
                const sameTypeMoves = getAllLegalMoves(simStateBefore, isWhite ? 'w' : 'b')
                    .filter(m => {
                        const p = simStateBefore.board[m.fromR][m.fromC];
                        return p && p.toLowerCase() === type && m.toR === move.toR && m.toC === move.toC &&
                               (m.fromR !== move.fromR || m.fromC !== move.fromC);
                    });
                if (sameTypeMoves.length > 0) {
                    const sameFile = sameTypeMoves.some(m => m.fromC === move.fromC);
                    const sameRank = sameTypeMoves.some(m => m.fromR === move.fromR);
                    if (!sameFile) san += String.fromCharCode(97 + move.fromC);
                    else if (!sameRank) san += (8 - move.fromR);
                    else san += squareToAlg(move.fromR, move.fromC);
                }
            }

            if (move.capture || move.isEnPassant) {
                if (type === 'p') san += String.fromCharCode(97 + move.fromC);
                san += 'x';
            }

            san += squareToAlg(move.toR, move.toC);

            if (move.promotion) san += '=' + move.promotion.toUpperCase();

            // Check / mate will be added after
            return san;
        }

        function boardToFEN(simState) {
            let fen = '';
            for (let r = 0; r < 8; r++) {
                let empty = 0;
                for (let c = 0; c < 8; c++) {
                    const p = simState.board[r][c];
                    if (!p) empty++;
                    else {
                        if (empty) { fen += empty; empty = 0; }
                        fen += p;
                    }
                }
                if (empty) fen += empty;
                if (r < 7) fen += '/';
            }
            fen += ' ' + simState.turn;
            let cast = '';
            if (simState.castling.wK) cast += 'K';
            if (simState.castling.wQ) cast += 'Q';
            if (simState.castling.bK) cast += 'k';
            if (simState.castling.bQ) cast += 'q';
            fen += ' ' + (cast || '-');
            if (simState.enPassant) fen += ' ' + squareToAlg(simState.enPassant.r, simState.enPassant.c);
            else fen += ' -';
            fen += ' ' + simState.halfmoveClock + ' ' + simState.fullmoveNumber;
            return fen;
        }

        function parseFEN(fenStr) {
            try {
                const parts = fenStr.trim().split(/\s+/);
                if (parts.length < 4) throw new Error('FEN inválido');
                const rows = parts[0].split('/');
                if (rows.length !== 8) throw new Error('FEN inválido');
                const board = [];
                for (const row of rows) {
                    const arr = [];
                    for (const ch of row) {
                        if (/\d/.test(ch)) {
                            for (let i = 0; i < parseInt(ch); i++) arr.push('');
                        } else {
                            arr.push(ch);
                        }
                    }
                    if (arr.length !== 8) throw new Error('FEN inválido');
                    board.push(arr);
                }
                const turn = parts[1] === 'b' ? 'b' : 'w';
                const castling = { wK: false, wQ: false, bK: false, bQ: false };
                if (parts[2] !== '-') {
                    if (parts[2].includes('K')) castling.wK = true;
                    if (parts[2].includes('Q')) castling.wQ = true;
                    if (parts[2].includes('k')) castling.bK = true;
                    if (parts[2].includes('q')) castling.bQ = true;
                }
                let enPassant = null;
                if (parts[3] !== '-') {
                    const c = parts[3].charCodeAt(0) - 97;
                    const r = 8 - parseInt(parts[3][1]);
                    enPassant = { r, c };
                }
                const halfmoveClock = parts[4] ? parseInt(parts[4]) : 0;
                const fullmoveNumber = parts[5] ? parseInt(parts[5]) : 1;

                return {
                    board,
                    turn,
                    castling,
                    enPassant,
                    lastMove: null,
                    captured: { w: [], b: [] },
                    gameOver: false,
                    inCheck: isInCheck(board, turn),
                    halfmoveClock,
                    fullmoveNumber,
                    positionHistory: []
                };
            } catch (e) {
                showToast('FEN inválido');
                return null;
            }
        }

        function generatePGN() {
            let pgn = '[Event "Ajedrez Nanai"]\n[Site "GitHub Pages"]\n[Date "' + new Date().toISOString().slice(0,10) + '"]\n';
            pgn += '[White "Jugador"]\n[Black "Jugador"]\n[Result "*"]\n\n';
            let moveNum = 1;
            for (let i = 0; i < moveHistory.length; i++) {
                if (i % 2 === 0) pgn += moveNum + '. ';
                pgn += moveHistory[i].san + ' ';
                if (i % 2 === 1) { pgn += '\n'; moveNum++; }
            }
            return pgn.trim() + ' *';
        }

        function copyFEN() {
            const fen = boardToFEN(state);
            navigator.clipboard.writeText(fen).then(() => showToast('FEN copiado')).catch(() => showToast(fen));
        }

        function copyPGN() {
            const pgn = generatePGN();
            navigator.clipboard.writeText(pgn).then(() => showToast('PGN copiado')).catch(() => showToast('PGN generado'));
        }

        function loadFENPrompt() {
            const fen = prompt('Pega un FEN válido:');
            if (!fen) return;
            const newState = parseFEN(fen);
            if (!newState) return;
            if (aiTimer) clearTimeout(aiTimer);
            state = newState;
            historyStack = [];
            moveHistory = [];
            selectedSquare = null;
            legalMovesForSelected = [];
            document.getElementById('btn-undo').disabled = true;
            document.getElementById('game-status').textContent = state.inCheck ? '¡Jaque!' : 'En curso';
            updateMovesList();
            renderBoard();
            showToast('Posición cargada');
            triggerAIMove();
        }

        /* ============================================================
           7. UI & EVENTS
           ============================================================ */
        function initBoardDOM() {
            const container = document.getElementById('chessboard');
            container.innerHTML = '';
            const files = ['a','b','c','d','e','f','g','h'];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.id = `sq-${r}-${c}`;
                    sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    sq.dataset.r = r;
                    sq.dataset.c = c;

                    sq.addEventListener('click', () => handleSquareClick(r, c));
                    sq.addEventListener('dragstart', (e) => handleDragStart(e, r, c));
                    sq.addEventListener('dragover', (e) => { e.preventDefault(); sq.classList.add('drag-over'); });
                    sq.addEventListener('dragleave', () => sq.classList.remove('drag-over'));
                    sq.addEventListener('drop', (e) => handleDrop(e, r, c));
                    sq.addEventListener('dragend', () => {
                        document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
                        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                        dragSource = null;
                    });

                    if (c === 0) {
                        const rankLbl = document.createElement('span');
                        rankLbl.className = 'coord-label coord-rank';
                        rankLbl.textContent = 8 - r;
                        sq.appendChild(rankLbl);
                    }
                    if (r === 7) {
                        const fileLbl = document.createElement('span');
                        fileLbl.className = 'coord-label coord-file';
                        fileLbl.textContent = files[c];
                        sq.appendChild(fileLbl);
                    }

                    const pieceHolder = document.createElement('div');
                    pieceHolder.className = 'piece-holder';
                    pieceHolder.draggable = true;
                    sq.appendChild(pieceHolder);
                    container.appendChild(sq);
                }
            }
        }

        function handleDragStart(e, r, c) {
            if (state.gameOver || pendingPromotion || isAIThinking) { e.preventDefault(); return; }
            if (gameMode === 'aivia') { e.preventDefault(); return; }
            if (gameMode === '1vai' && state.turn !== humanColor) { e.preventDefault(); return; }

            const piece = state.board[r][c];
            if (!belongsTo(piece, state.turn)) { e.preventDefault(); return; }

            dragSource = { r, c };
            selectedSquare = { r, c };
            const allLegal = getAllLegalMoves(state, state.turn);
            legalMovesForSelected = allLegal.filter(m => m.fromR === r && m.fromC === c);
            e.dataTransfer.setData('text/plain', `${r},${c}`);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => {
                const holder = document.getElementById(`sq-${r}-${c}`).querySelector('.piece-holder');
                if (holder) holder.classList.add('dragging');
            }, 0);
            renderBoard();
        }

        function handleDrop(e, r, c) {
            e.preventDefault();
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            if (!dragSource) return;

            const matching = legalMovesForSelected.filter(m => m.toR === r && m.toC === c);
            if (matching.length > 0) {
                if (matching[0].promotion) openPromotionModal(matching);
                else commitMove(matching[0]);
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
                renderBoard();
            }
            dragSource = null;
        }

        function renderBoard() {
            const kingInCheckPos = state.inCheck ? findKing(state.board, state.turn) : null;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.getElementById(`sq-${r}-${c}`);
                    const holder = sq.querySelector('.piece-holder');
                    const piece = state.board[r][c];

                    sq.classList.remove('selected', 'highlight', 'highlight-capture', 'last-move', 'in-check');

                    if (state.lastMove && ((state.lastMove.fromR === r && state.lastMove.fromC === c) ||
                        (state.lastMove.toR === r && state.lastMove.toC === c))) {
                        sq.classList.add('last-move');
                    }
                    if (kingInCheckPos && kingInCheckPos.r === r && kingInCheckPos.c === c) {
                        sq.classList.add('in-check');
                    }
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        sq.classList.add('selected');
                    }
                    const moveHere = legalMovesForSelected.find(m => m.toR === r && m.toC === c);
                    if (moveHere) {
                        sq.classList.add(moveHere.capture ? 'highlight-capture' : 'highlight');
                    }

                    if (holder.dataset.piece !== piece) {
                        holder.dataset.piece = piece;
                        holder.innerHTML = piece ? getPieceSVG(piece) : '';
                        holder.draggable = !!piece;
                    }
                }
            }
            updateStatusUI();
            updateMovesList();
        }

        function handleSquareClick(r, c) {
            if (state.gameOver || pendingPromotion || isAIThinking) return;
            if (gameMode === 'aivia') return;
            if (gameMode === '1vai' && state.turn !== humanColor) return;

            const clickedPiece = state.board[r][c];

            if (selectedSquare) {
                if (selectedSquare.r === r && selectedSquare.c === c) {
                    selectedSquare = null;
                    legalMovesForSelected = [];
                    renderBoard();
                    return;
                }
                const matchingMoves = legalMovesForSelected.filter(m => m.toR === r && m.toC === c);
                if (matchingMoves.length > 0) {
                    if (matchingMoves[0].promotion) openPromotionModal(matchingMoves);
                    else commitMove(matchingMoves[0]);
                    return;
                }
            }

            if (belongsTo(clickedPiece, state.turn)) {
                selectedSquare = { r, c };
                const allLegal = getAllLegalMoves(state, state.turn);
                legalMovesForSelected = allLegal.filter(m => m.fromR === r && m.fromC === c);
                renderBoard();
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
                renderBoard();
            }
        }

        function openPromotionModal(promoMoves) {
            pendingPromotion = promoMoves;
            const modal = document.getElementById('promotion-modal');
            const optionsContainer = document.getElementById('promotion-options');
            optionsContainer.innerHTML = '';
            promoMoves.forEach(move => {
                const char = state.turn === 'w' ? move.promotion.toUpperCase() : move.promotion.toLowerCase();
                const btn = document.createElement('button');
                btn.className = 'p-2 rounded-xl btn-flat flex items-center justify-center aspect-square border border-transparent hover:border-[#E5A853]';
                btn.innerHTML = getPieceSVG(char, 'w-10 h-10');
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    pendingPromotion = null;
                    commitMove(move);
                };
                optionsContainer.appendChild(btn);
            });
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function commitMove(move) {
            const before = cloneState(state);
            let san = moveToSAN(move, before);

            historyStack.push(cloneState(state));
            document.getElementById('btn-undo').disabled = false;

            state = applyMoveToState(state, move);

            // Position history for threefold
            const key = getPositionKey(state);
            state.positionHistory.push(key);

            // Check / mate suffix
            const nextLegal = getAllLegalMoves(state, state.turn);
            if (nextLegal.length === 0 && state.inCheck) san += '#';
            else if (state.inCheck) san += '+';

            moveHistory.push({ san, move });

            selectedSquare = null;
            legalMovesForSelected = [];

            const statusEl = document.getElementById('game-status');

            if (nextLegal.length === 0) {
                state.gameOver = true;
                if (state.inCheck) {
                    const winner = state.turn === 'w' ? 'Negras' : 'Blancas';
                    statusEl.textContent = `¡Mate! Ganan ${winner}`;
                    showToast(`¡Jaque Mate! Ganan las ${winner}`);
                } else {
                    statusEl.textContent = 'Tablas por Ahogado';
                    showToast('Partida empatada: Rey Ahogado');
                }
                playSound('gameover');
            } else if (hasInsufficientMaterial(state.board)) {
                state.gameOver = true;
                statusEl.textContent = 'Tablas (Material)';
                showToast('Tablas por material insuficiente');
                playSound('gameover');
            } else if (state.halfmoveClock >= 100) {
                state.gameOver = true;
                statusEl.textContent = 'Tablas (50 jugadas)';
                showToast('Tablas por regla de las 50 jugadas');
                playSound('gameover');
            } else if (countRepetitions(state) >= 3) {
                state.gameOver = true;
                statusEl.textContent = 'Tablas (Repetición)';
                showToast('Tablas por triple repetición');
                playSound('gameover');
            } else if (state.inCheck) {
                statusEl.textContent = '¡Jaque!';
                playSound('check');
            } else {
                statusEl.textContent = 'En curso';
                playSound(move.capture || move.isEnPassant ? 'capture' : 'move');
            }

            renderBoard();
            if (!state.gameOver) triggerAIMove();
        }

        function undoMove() {
            if (historyStack.length === 0 || pendingPromotion) return;
            if (aiTimer) clearTimeout(aiTimer);
            setAIThinking(false);

            // In 1vsAI, undo the pair if possible
            if (gameMode === '1vai' && historyStack.length >= 2 && state.turn === humanColor) {
                historyStack.pop();
                moveHistory.pop();
                state = historyStack.pop();
                moveHistory.pop();
            } else {
                state = historyStack.pop();
                moveHistory.pop();
            }

            selectedSquare = null;
            legalMovesForSelected = [];
            document.getElementById('btn-undo').disabled = historyStack.length === 0;
            document.getElementById('game-status').textContent = state.inCheck ? '¡Jaque!' : (state.gameOver ? 'Fin' : 'En curso');
            renderBoard();
            showToast('Jugada deshecha');
        }

        function updateStatusUI() {
            const turnDot = document.getElementById('turn-dot');
            const turnText = document.getElementById('turn-text');
            if (state.turn === 'w') {
                turnDot.style.backgroundColor = '#FDF3E7';
                turnDot.style.borderColor = '#3B141A';
                turnText.textContent = 'Blancas';
            } else {
                turnDot.style.backgroundColor = '#240B10';
                turnDot.style.borderColor = '#E5A853';
                turnText.textContent = 'Negras';
            }

            const capWEl = document.getElementById('captured-by-white');
            const capBEl = document.getElementById('captured-by-black');
            const sortOrder = { q:1, r:2, b:3, n:4, p:5 };
            const sortedW = [...state.captured.w].sort((a,b) => sortOrder[a.toLowerCase()] - sortOrder[b.toLowerCase()]);
            const sortedB = [...state.captured.b].sort((a,b) => sortOrder[a.toLowerCase()] - sortOrder[b.toLowerCase()]);
            capWEl.innerHTML = sortedW.map(p => getPieceSVG(p, 'w-5 h-5')).join('');
            capBEl.innerHTML = sortedB.map(p => getPieceSVG(p, 'w-5 h-5')).join('');

            const matW = sortedW.reduce((acc, p) => acc + (PIECE_VALUES[p.toLowerCase()] / 100), 0);
            const matB = sortedB.reduce((acc, p) => acc + (PIECE_VALUES[p.toLowerCase()] / 100), 0);
            const diff = Math.round(matW - matB);
            const advWEl = document.getElementById('advantage-white');
            const advBEl = document.getElementById('advantage-black');
            if (diff > 0) {
                advWEl.textContent = `+${diff}`;
                advWEl.classList.remove('hidden');
                advBEl.classList.add('hidden');
            } else if (diff < 0) {
                advBEl.textContent = `+${Math.abs(diff)}`;
                advBEl.classList.remove('hidden');
                advWEl.classList.add('hidden');
            } else {
                advWEl.classList.add('hidden');
                advBEl.classList.add('hidden');
            }

            document.getElementById('halfmove-clock').textContent = state.halfmoveClock;
            document.getElementById('rep-count').textContent = countRepetitions(state);
        }

        function updateMovesList() {
            const el = document.getElementById('moves-list');
            if (moveHistory.length === 0) {
                el.innerHTML = '<span style="color:var(--text-3)">Sin jugadas aún</span>';
                return;
            }
            let html = '';
            for (let i = 0; i < moveHistory.length; i += 2) {
                const num = Math.floor(i / 2) + 1;
                const w = moveHistory[i] ? moveHistory[i].san : '';
                const b = moveHistory[i+1] ? moveHistory[i+1].san : '';
                html += `<div class="flex gap-2"><span class="w-6 text-right opacity-60">${num}.</span><span class="w-16">${w}</span><span class="w-16">${b}</span></div>`;
            }
            el.innerHTML = html;
            el.scrollTop = el.scrollHeight;
        }

        function flipBoard() {
            isFlipped = !isFlipped;
            document.getElementById('chessboard').classList.toggle('flipped', isFlipped);
        }

        function changeGameMode(mode) {
            gameMode = mode;
            const depthWrapper = document.getElementById('ai-depth-wrapper');
            const colorWrapper = document.getElementById('human-color-wrapper');
            depthWrapper.style.opacity = mode === '1v1' ? '0.4' : '1';
            document.getElementById('ai-depth').disabled = mode === '1v1';
            colorWrapper.style.opacity = mode === '1vai' ? '1' : '0.4';
            document.getElementById('human-color').disabled = mode !== '1vai';
            resetGame(false);
            const labels = { '1v1': '1 vs 1', '1vai': '1 vs IA', 'aivia': 'IA vs IA' };
            showToast(`Modo: ${labels[mode]}`);
        }

        function changeHumanColor(val) {
            humanColor = val;
            // Auto-flip board so human pieces are at bottom
            const shouldFlip = humanColor === 'b';
            if (isFlipped !== shouldFlip) flipBoard();
            resetGame(false);
            showToast(humanColor === 'w' ? 'Juegas con Blancas' : 'Juegas con Negras');
        }

        function changeAIDepth(val) {
            aiDepth = parseInt(val, 10);
            const names = { 1: 'Básico', 2: 'Intermedio', 3: 'Avanzado' };
            showToast(`Nivel IA: ${names[aiDepth]}`);
        }

        function resetGame(notify = true) {
            if (aiTimer) clearTimeout(aiTimer);
            setAIThinking(false);
            pendingPromotion = null;
            document.getElementById('promotion-modal').classList.add('hidden');
            document.getElementById('promotion-modal').classList.remove('flex');

            state = {
                board: INITIAL_BOARD.map(row => [...row]),
                turn: 'w',
                castling: { wK: true, wQ: true, bK: true, bQ: true },
                enPassant: null,
                lastMove: null,
                captured: { w: [], b: [] },
                gameOver: false,
                inCheck: false,
                halfmoveClock: 0,
                fullmoveNumber: 1,
                positionHistory: []
            };

            historyStack = [];
            moveHistory = [];
            selectedSquare = null;
            legalMovesForSelected = [];
            document.getElementById('btn-undo').disabled = true;
            document.getElementById('game-status').textContent = 'En curso';

            // Ensure board orientation matches human color
            const shouldFlip = (gameMode === '1vai' && humanColor === 'b');
            if (isFlipped !== shouldFlip) {
                isFlipped = shouldFlip;
                document.getElementById('chessboard').classList.toggle('flipped', isFlipped);
            }

            renderBoard();
            if (notify) showToast('Partida reiniciada');
            triggerAIMove();
        }

        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        window.onload = function () {
            initBoardDOM();
            resetGame(false);
        };
    </script>
</body>
