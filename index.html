<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS para diseño responsivo y elegante -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js para validación completa de reglas de ajedrez (jaque, jaque mate, enroque, promoción) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Tone.js para efectos de sonido procedurales (pasos, espadas, explosiones, victoria) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Fuente Google Fonts: Cinzel e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col justify-center p-3 sm:p-5">

    <!-- Indicador Compacto de Turno -->
    <div class="w-full max-w-4xl mx-auto flex justify-center mb-3">
        <div id="status-card" class="battle-banner flex items-center gap-3 px-4 py-2 rounded-xl border backdrop-blur-sm">
            <span id="turn-indicator" class="w-3.5 h-3.5 rounded-full bg-[#FDF3E7] shadow-[0_0_8px_#E5A853]"></span>
            <span id="status-text" class="text-sm font-semibold text-primary-ivory">Turno: Reino Marfil</span>
            <span id="rapid-timer" class="hidden font-mono text-xs font-bold text-accent-gold border-l border-[#E5A853]/40 pl-3">3:00 · 3:00</span>
        </div>
    </div>

    <!-- Área Principal del Tablero -->
    <main class="w-full max-w-4xl mx-auto flex flex-col lg:flex-row items-center justify-center gap-4 my-auto">
        
        <!-- Panel Izquierdo / Superior: Capturas Negras -->
        <div class="w-full lg:w-44 flex lg:flex-col justify-between items-center surface-card border rounded-xl p-3 gap-2 shadow-lg">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-[#3B141A] border border-[#E5A853]"></div>
                <span class="text-xs font-bold uppercase tracking-wider text-accent-gold">Orden Granate</span>
            </div>
            <div id="captured-by-black" class="flex flex-wrap gap-1 min-h-[28px] justify-center text-lg text-primary-ivory"></div>
        </div>

        <!-- Contenedor del Lienzo Interactivo -->
        <div id="game-container" class="flex-shrink-0">
            <canvas id="chessCanvas"></canvas>
            
            <!-- Overlay de Narración de Batalla -->
            <div id="combat-overlay" class="pointer-events-none absolute inset-x-4 bottom-4 flex justify-center opacity-0 transition-opacity duration-300">
                <div class="bg-[#3B141A]/95 border border-[#E5A853]/75 px-4 py-2 rounded-full shadow-2xl flex items-center gap-2">
                    <span class="text-accent-gold text-base">🔥</span>
                    <span id="combat-log" class="text-xs sm:text-sm font-bold text-primary-ivory tracking-wide"></span>
                </div>
            </div>

            <!-- Modal de Fin de Partida -->
            <div id="gameover-modal" class="hidden absolute inset-0 bg-[#3B141A]/90 backdrop-blur-md rounded-xl flex flex-col items-center justify-center p-6 text-center z-20 border border-[#E5A853]/50">
                <div class="text-5xl mb-3">👑</div>
                <div id="gameover-title" class="font-epic text-2xl sm:text-3xl font-extrabold text-accent-gold mb-2">¡Victoria!</div>
                <p id="gameover-desc" class="text-muted-ivory text-sm mb-6 max-w-xs">La batalla ha concluido en el tablero.</p>
                <button onclick="resetGame()" class="btn-epic px-6 py-3 rounded-xl font-extrabold text-sm tracking-wide cursor-pointer">
                    Nueva Batalla
                </button>
            </div>
        </div>

        <!-- Panel Derecho / Inferior: Capturas Blancas -->
        <div class="w-full lg:w-44 flex lg:flex-col justify-between items-center surface-card border rounded-xl p-3 gap-2 shadow-lg">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-[#FDF3E7] border border-[#C9863B]"></div>
                <span class="text-xs font-bold uppercase tracking-wider text-accent-gold">Reino Marfil</span>
            </div>
            <div id="captured-by-white" class="flex flex-wrap gap-1 min-h-[28px] justify-center text-lg text-primary-ivory"></div>
        </div>
    </main>

    <!-- Controles Inferiores -->
    <footer class="w-full max-w-4xl mx-auto mt-3 flex flex-wrap items-center justify-center gap-3">
        <button onclick="resetGame()" class="btn-surface px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-2">
            <span>🔄</span> Reiniciar Partida
        </button>

        <button id="ai-toggle-btn" onclick="toggleAI()" class="btn-surface px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-2">
            <span>🤖</span> Modo: <strong id="ai-mode-label" class="text-accent-gold">Contra IA Táctica</strong>
        </button>

        <button id="rapid-toggle-btn" onclick="toggleRapidMode()" class="btn-surface px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-2">
            <span>⏱️</span> <span id="rapid-mode-label">Ajedrez Rápido: Desactivado</span>
        </button>

        <button id="sound-toggle-btn" onclick="toggleSound()" class="btn-surface px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-2">
            <span id="sound-icon">🔊</span> <span id="sound-label">Sonido: Activado</span>
        </button>

        <button id="settings-toggle-btn" onclick="toggleSettingsPanel()" class="btn-surface px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-2">
            <span>⚙️</span> Personalizar
        </button>
    </footer>

    <aside id="settings-panel" class="settings-panel hidden w-full max-w-4xl mx-auto mt-3 p-4 rounded-2xl border surface-card" aria-label="Configuración visual">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-epic text-accent-gold text-sm font-bold">Configuración de batalla</h2>
            <button onclick="toggleSettingsPanel()" class="text-muted-ivory text-lg" aria-label="Cerrar configuración">×</button>
        </div>
        <div class="settings-grid">
            <label>Tema
                <select id="theme-select" class="settings-control">
                    <option value="ink">Tinta Granate</option><option value="parchment">Pergamino</option><option value="midnight">Noche Azul</option>
                </select>
            </label>
            <label>Calidad de partículas
                <select id="quality-select" class="settings-control"><option value="high">Alta</option><option value="medium">Media</option><option value="low">Baja</option></select>
            </label>
            <label class="settings-check"><input id="particles-toggle" type="checkbox"> Partículas y tinta</label>
            <label class="settings-check"><input id="environment-toggle" type="checkbox"> Ambiente, hojas y brasas</label>
            <label class="settings-check"><input id="motion-toggle" type="checkbox"> Reducir movimiento</label>
            <label>Volumen <input id="volume-range" class="w-full" type="range" min="0" max="1" step="0.05"></label>
        </div>
    </aside>

    <script src="js/config.js"></script>
    <script src="js/modules/board-environment.js"></script>
    <script src="js/modules/particles-ink.js"></script>
    <script src="js/modules/piece-animations.js"></script>
    <script src="js/modules/checkmate.js"></script>
    <script src="js/modules/special-combat.js"></script>
    <script src="js/battle-chess.js"></script>
</body>
</html>
